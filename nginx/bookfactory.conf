# Book Factory — local dev server block.
#
# Include this from the http { } block of
# /opt/homebrew/etc/nginx/nginx.conf:
#
#   include /opt/homebrew/opt/nginx/html/bookfactory/nginx/bookfactory.conf;
#
# ...and comment out the stock `server { listen 8080; ... }` block so this one
# owns the port. Then: nginx -t && brew services restart nginx

server {
    listen       8080;
    server_name  localhost;

    root   /opt/homebrew/opt/nginx/html;
    index  index.php index.html;

    charset utf-8;

    access_log /opt/homebrew/var/log/nginx/bookfactory.access.log;
    error_log  /opt/homebrew/var/log/nginx/bookfactory.error.log;

    # Generated PDFs can be a few MB; give the download handler room.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Nothing below the app root should ever be served directly --------
    # PDFs go out through download.php, which checks the book is finished.
    location ~ ^/bookfactory/(storage|includes|ai|sql|nginx)/ {
        deny all;
        return 404;
    }

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    # ---- PHP --------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        # Homebrew's php-fpm listens on 127.0.0.1:9000 by default. If yours is
        # on a socket, swap this for:
        #   fastcgi_pass unix:/opt/homebrew/var/run/php-fpm.sock;
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $document_root;

        # PDF generation is not in the request path, but research + writing can
        # take a while if you ever move the worker inline.
        fastcgi_read_timeout 120s;
    }
}
